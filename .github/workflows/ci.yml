name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: relay logic tests (bash)
        run: bash tests/run.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: relay logic tests (PowerShell)
        shell: pwsh
        run: ./tests/run.ps1
